server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    location = /health { access_log off; return 200 'ok'; }
    location = /ready { proxy_pass http://api:8000/ready; }
    location /api/ { client_max_body_size 16m; proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
