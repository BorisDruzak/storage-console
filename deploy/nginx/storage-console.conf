server {
    listen 80;
    server_name ${STORAGE_HOSTNAME};
    server_tokens off;
    access_log off;
    return 308 https://${STORAGE_HOSTNAME}$request_uri;
}

server {
    listen 443 ssl;
    server_name ${STORAGE_HOSTNAME};
    server_tokens off;
    access_log off;
    root /usr/share/nginx/html;
    ssl_certificate /etc/storage-console/tls/fullchain.pem;
    ssl_certificate_key /etc/storage-console/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    auth_basic "Storage Console operator gateway";
    auth_basic_user_file /etc/storage-console/auth/users.htpasswd;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /health { auth_basic off; return 200 'ok'; }
    location = /ready { auth_basic off; proxy_pass http://api:8000/ready; }
    # Collector tokens are checked by API; operator Basic auth cannot replace them.
    location /api/v1/ingest/ {
        auth_basic off;
        limit_except POST { deny all; }
        client_max_body_size 16m;
        proxy_pass http://api:8000;
    }
    location /api/ { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}

# Container-local liveness/readiness only; this listener is never published.
server {
    listen 127.0.0.1:8081;
    server_tokens off;
    access_log off;
    location = /health { return 200 'ok'; }
    location = /ready { proxy_pass http://api:8000/ready; }
    location / { return 404; }
}
