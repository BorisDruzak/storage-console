name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storage_console_test
          POSTGRES_USER: storage_console_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U storage_console_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://storage_console_test:disposable-ci-password@127.0.0.1:5432/storage_console_test
      TEST_DATABASE_URL: postgresql+psycopg://storage_console_test:disposable-ci-password@127.0.0.1:5432/storage_console_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: mypy
      - run: mypy deploy/scripts --strict
      - run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 -x deploy/scripts/*.sh
      - run: python -m packages.contracts.export_openapi --check
      - run: pytest tests/deployment -q
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest --cov=apps --cov=packages --cov-report=xml
      - run: alembic downgrade base && alembic upgrade head
      - uses: actions/upload-artifact@v4
        with: {name: backend-coverage, path: coverage.xml}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with: {name: frontend-coverage, path: apps/web/coverage/lcov.info}

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Create private disposable HTTPS configuration
        run: |
          fixture_env=$(PYTHONPATH=. python tests/deployment/prepare_development.py)
          echo "FIXTURE_ENV=$fixture_env" >> "$GITHUB_ENV"
          echo "FIXTURE_CA=$(dirname "$fixture_env")/ca.pem" >> "$GITHUB_ENV"
      - run: docker compose --env-file "$FIXTURE_ENV" up --build --wait --wait-timeout 180
      - name: Strict TLS readiness and protected read
        run: |
          curl --fail --noproxy '*' --cacert "$FIXTURE_CA" --resolve storage.example.test:8443:127.0.0.1 https://storage.example.test:8443/ready
          status=$(curl --silent --noproxy '*' --cacert "$FIXTURE_CA" --resolve storage.example.test:8443:127.0.0.1 -o /dev/null -w '%{http_code}' https://storage.example.test:8443/api/v1/overview)
          test "$status" = 401
      - run: docker compose --env-file "$FIXTURE_ENV" run --rm migrate alembic check
      - run: docker compose --env-file "$FIXTURE_ENV" exec -T worker python -m apps.worker.health
      - if: always()
        run: docker compose --env-file "$FIXTURE_ENV" down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan committed history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --exit-code 1

  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Disposable production TLS and backup acceptance
        run: PYTHONPATH=. python tests/deployment/smoke_production.py

  sonar:
    if: vars.SONAR_HOST_URL != ''
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: backend-coverage}
      - uses: actions/download-artifact@v4
        with: {name: frontend-coverage, path: apps/web/coverage}
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
